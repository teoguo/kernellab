name: CI

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Debug
            sanitizers: ON
          - os: ubuntu-latest
            build_type: Release
            sanitizers: OFF
          - os: macos-latest
            build_type: Debug
            sanitizers: OFF

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DKERNELLAB_ENABLE_CUDA=OFF
          -DKERNELLAB_BUILD_TESTS=ON
          -DKERNELLAB_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --output-on-failure --build-config ${{ matrix.build_type }}

  future-cuda:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Reserved for future self-hosted Linux aarch64 CUDA 13 CI."
